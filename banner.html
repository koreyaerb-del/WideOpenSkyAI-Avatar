<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Learn About Our AI Avatars</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
@import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&family=Inter:wght@400;500&display=swap');
:root{--cyan:#00D4FF;--green:#1BAF7A;--navy:#0A0E1A;--card:#131929;--gray:#8A95A8;--border:rgba(0,212,255,0.2);}
html,body{background:transparent;font-family:'Inter',-apple-system,sans-serif;-webkit-font-smoothing:antialiased;}
body{padding:10px;}
.banner{max-width:1120px;margin:0 auto;display:flex;align-items:center;gap:22px;text-decoration:none;color:#fff;
  background:radial-gradient(ellipse at 0% 0%,rgba(0,212,255,.10),transparent 55%),radial-gradient(ellipse at 100% 100%,rgba(139,92,246,.10),transparent 55%),linear-gradient(180deg,#0C1120,#0A0E1A);
  border:1px solid var(--border);border-radius:18px;padding:20px 26px;position:relative;overflow:hidden;
  transition:transform .2s ease,box-shadow .2s ease,border-color .2s ease;}
.banner::before{content:'';position:absolute;inset:0;background-image:linear-gradient(rgba(0,212,255,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(0,212,255,.04) 1px,transparent 1px);background-size:40px 40px;pointer-events:none;}
.banner:hover{transform:translateY(-2px);border-color:rgba(0,212,255,.5);box-shadow:0 18px 40px rgba(0,0,0,.5),0 0 0 1px rgba(0,212,255,.15);}
.stack{display:flex;flex-shrink:0;position:relative;z-index:1;}
.av{width:62px;height:62px;border-radius:50%;overflow:hidden;border:2px solid #0C1120;box-shadow:0 0 0 1px rgba(0,212,255,.35);margin-left:-16px;background:var(--card);}
.av:first-child{margin-left:0;}
.av img{width:100%;height:100%;object-fit:cover;object-position:center top;display:block;}
.btxt{flex:1;min-width:0;position:relative;z-index:1;}
.beye{display:inline-flex;align-items:center;gap:6px;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--cyan);font-weight:500;margin-bottom:5px;}
.beye::before{content:'';width:5px;height:5px;border-radius:50%;background:var(--cyan);box-shadow:0 0 8px var(--cyan);animation:pulse 2s infinite;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.bh{font-family:'Rajdhani',sans-serif;font-weight:700;font-size:clamp(20px,3.6vw,30px);line-height:1.05;letter-spacing:.01em;}
.bh .c{color:var(--cyan);}
.bs{font-size:clamp(12px,2.2vw,14px);color:var(--gray);margin-top:4px;line-height:1.45;}
.bcta{flex-shrink:0;position:relative;z-index:1;display:inline-flex;align-items:center;gap:8px;background:var(--green);color:var(--navy);font-weight:700;font-size:14px;padding:12px 20px;border-radius:10px;white-space:nowrap;}
.bcta .arr{transition:transform .2s ease;}
.banner:hover .bcta .arr{transform:translateX(4px);}
@media(max-width:680px){
  .banner{flex-direction:column;text-align:center;gap:14px;padding:20px;}
  .btxt{text-align:center;}
  .beye{justify-content:center;}
  .bcta{width:100%;justify-content:center;}
}
@media(prefers-reduced-motion:reduce){.beye::before{animation:none;}}
</style></head>
